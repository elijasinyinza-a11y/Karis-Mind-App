<!--
  ============================================================
  CLIENTS PAGE
  pages/clients.html

  The full client directory. Entry point to every client record.
  Init function: init_clients() — called automatically by router.

  Sections:
  1. Page header      — title + "New client" button
  2. Toolbar          — search + sort
  3. Client list      — rendered from KarisState.clients
  4. New client modal — creates a record, navigates into it
  ============================================================
-->


<!-- ── 1. PAGE HEADER ─────────────────────────────────────── -->
<div class="page-header">
  <div class="page-header-left">
    <div class="page-title">Clients</div>
    <div class="page-subtitle">All client organisations you manage</div>
  </div>
  <button class="btn btn-primary" onclick="openModal('modal-new-client')">
    + New client
  </button>
</div>


<!-- ── 2. TOOLBAR: search + sort ──────────────────────────── -->
<div class="d-flex align-center gap-3 mb-5" style="flex-wrap: wrap">

  <!-- Search -->
  <div class="search-wrap" style="flex: 1; min-width: 220px; max-width: 360px">
    <svg class="search-icon" width="14" height="14" fill="none"
         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
         aria-hidden="true">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="search-input"
           type="text"
           id="client-search"
           placeholder="Search by name or sector…"
           oninput="_filterClients()"
           autocomplete="off">
  </div>

  <!-- Sort -->
  <select class="form-select"
          id="client-sort"
          style="width: auto; min-width: 160px"
          onchange="_sortAndRender()">
    <option value="recent">Recent activity</option>
    <option value="name">Name (A–Z)</option>
    <option value="sector">Sector</option>
  </select>

  <!-- Count -->
  <div class="text-sm text-muted ml-auto" id="client-count"></div>

</div>


<!-- ── 3. CLIENT LIST ─────────────────────────────────────── -->
<div class="table-wrap" id="clients-table">
  <!-- Rendered by init_clients() -->
</div>


<!-- ── 4. NEW CLIENT MODAL ────────────────────────────────── -->
<div class="modal-backdrop" id="modal-new-client">
  <div class="modal">

    <div class="modal-title">New client record</div>

    <div class="form-field">
      <label class="form-label" for="nc-name">Organisation name *</label>
      <input class="form-input" id="nc-name" type="text"
             placeholder="e.g. Zambia Revenue Authority"
             autocomplete="off">
    </div>

    <div class="form-field">
      <label class="form-label" for="nc-fullname">Full legal name</label>
      <input class="form-input" id="nc-fullname" type="text"
             placeholder="Optional — full registered name"
             autocomplete="off">
    </div>

    <div class="form-field">
      <label class="form-label" for="nc-sector">Sector</label>
      <select class="form-select" id="nc-sector">
        <option value="">Select sector…</option>
        <option>Utilities</option>
        <option>Energy</option>
        <option>Financial Services</option>
        <option>Government</option>
        <option>Healthcare</option>
        <option>Education</option>
        <option>Mining</option>
        <option>Telecoms</option>
        <option>Manufacturing</option>
        <option>NGO / Non-profit</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-field">
      <label class="form-label" for="nc-location">Location</label>
      <input class="form-input" id="nc-location" type="text"
             placeholder="Optional — e.g. Lusaka"
             autocomplete="off">
    </div>

    <div class="form-field">
      <label class="form-label" for="nc-contact">Primary contact name</label>
      <input class="form-input" id="nc-contact" type="text"
             placeholder="Optional"
             autocomplete="off">
    </div>

    <div class="form-field">
      <label class="form-label" for="nc-email">Primary contact email</label>
      <input class="form-input" id="nc-email" type="email"
             placeholder="Optional"
             autocomplete="off">
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-new-client')">
        Cancel
      </button>
      <button class="btn btn-primary" onclick="_createClient()">
        Create client record
      </button>
    </div>

  </div>
</div>


<!-- ── PAGE SCRIPT ────────────────────────────────────────── -->
<script>

/* Called automatically by KarisRouter after page loads */
function init_clients() {
  _sortAndRender();
}


/* ── Render the client list ── */
function _renderClients(clients) {
  const table = document.getElementById('clients-table');
  const count = document.getElementById('client-count');
  if (!table) return;

  /* Update count */
  if (count) {
    count.textContent = clients.length +
      (clients.length === 1 ? ' client' : ' clients');
  }

  /* Empty state */
  if (!clients.length) {
    table.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">○</div>
        <div class="empty-state-title">No clients found</div>
        <div class="empty-state-sub">
          Try a different search, or create a new client record.
        </div>
        <button class="btn btn-primary" onclick="openModal('modal-new-client')">
          + New client
        </button>
      </div>`;
    return;
  }

  /* Build rows */
  table.innerHTML = clients.map(function(c) {

    /* Instrument badges — only show started instruments */
    const badges = [];
    if (c.instruments.ocam     && c.instruments.ocam.status     !== 'not-started') badges.push('<span class="badge badge-ocam">OCAM</span>');
    if (c.instruments.gold     && c.instruments.gold.status     !== 'not-started') badges.push('<span class="badge badge-gold-i">GOLD</span>');
    if (c.instruments.strategy && c.instruments.strategy.status !== 'not-started') badges.push('<span class="badge badge-strategy">Strategy</span>');
    const badgeHtml = badges.length
      ? badges.join('')
      : '<span class="badge badge-muted">Not started</span>';

    /* Status badge */
    const statusClass = KarisState.getStatusBadgeClass(c.status);
    let statusLabel = 'Active';
    if (c.status === 'new')     statusLabel = 'New';
    if (c.status === 'dormant') statusLabel = 'Dormant';

    return `
      <div class="table-row clickable"
           onclick="KarisRouter.goToClient('${c.id}')">

        <!-- Initials avatar -->
        <div style="
          width: 38px; height: 38px;
          border-radius: var(--radius-md);
          background: var(--color-cream-dark);
          border: 1px solid var(--color-border);
          display: flex; align-items: center; justify-content: center;
          font-size: var(--text-sm);
          font-weight: var(--weight-bold);
          color: var(--color-navy);
          flex-shrink: 0;"
          aria-hidden="true">
          ${_clientInitials(c.name)}
        </div>

        <!-- Name + sector/location -->
        <div style="flex: 1; min-width: 0">
          <div style="font-size: var(--text-md);
                      font-weight: var(--weight-semibold);
                      color: var(--color-navy)"
               class="truncate">
            ${c.name}
          </div>
          <div class="text-sm text-muted truncate">
            ${c.sector}${c.location ? ' · ' + c.location : ''}
          </div>
        </div>

        <!-- Instrument badges -->
        <div class="d-flex gap-2 flex-shrink-0"
             style="margin-right: var(--space-2)">
          ${badgeHtml}
        </div>

        <!-- Last activity -->
        <div class="text-sm text-muted flex-shrink-0"
             style="min-width: 96px; text-align: right">
          ${c.lastActivity}
        </div>

        <!-- Status -->
        <div class="flex-shrink-0" style="min-width: 72px; text-align: right">
          <span class="badge ${statusClass}">${statusLabel}</span>
        </div>

      </div>`;

  }).join('');
}


/* ── Filter by search query ── */
function _filterClients() {
  _sortAndRender();
}


/* ── Sort + render together ── */
function _sortAndRender() {
  const query = (document.getElementById('client-search')?.value || '').toLowerCase().trim();
  const sortBy = document.getElementById('client-sort')?.value || 'recent';

  /* Start from all clients */
  let list = KarisState.clients.slice();

  /* Filter by search */
  if (query) {
    list = list.filter(function(c) {
      return c.name.toLowerCase().includes(query) ||
             (c.sector   && c.sector.toLowerCase().includes(query)) ||
             (c.location && c.location.toLowerCase().includes(query)) ||
             (c.fullName && c.fullName.toLowerCase().includes(query));
    });
  }

  /* Sort */
  if (sortBy === 'name') {
    list.sort(function(a, b) { return a.name.localeCompare(b.name); });
  } else if (sortBy === 'sector') {
    list.sort(function(a, b) { return (a.sector || '').localeCompare(b.sector || ''); });
  }
  /* 'recent' keeps the natural order in state.js (already recent-first) */

  _renderClients(list);
}


/* ── Create a new client ── */
async function _createClient() {
  const name     = document.getElementById('nc-name').value.trim();
  const fullName = document.getElementById('nc-fullname').value.trim();
  const sector   = document.getElementById('nc-sector').value;
  const location = document.getElementById('nc-location').value.trim();
  const contact  = document.getElementById('nc-contact').value.trim();
  const email    = document.getElementById('nc-email').value.trim();

  /* Validation — name is required */
  if (!name) {
    showToast('Please enter an organisation name');
    document.getElementById('nc-name').focus();
    return;
  }

  /* Build the payload */
  const payload = {
    name:     name,
    fullName: fullName || name,
    sector:   sector,
    location: location,
    contact:  (contact || email) ? { name: contact, email: email } : null
  };

  /* Create via API (adds to KarisState.clients) */
  const newClient = await KarisAPI.createClient(payload);

  /* Reset the form */
  document.getElementById('nc-name').value     = '';
  document.getElementById('nc-fullname').value = '';
  document.getElementById('nc-sector').value   = '';
  document.getElementById('nc-location').value = '';
  document.getElementById('nc-contact').value  = '';
  document.getElementById('nc-email').value    = '';

  /* Close modal + confirm */
  closeModal('modal-new-client');
  showToast(name + ' created');

  /* Navigate straight into the new client record */
  KarisRouter.goToClient(newClient.id);
}


/* ── Helper: initials from a client name ── */
function _clientInitials(name) {
  const words = name.trim().split(/\s+/);
  if (words.length === 1) {
    return words[0].substring(0, 2).toUpperCase();
  }
  return (words[0][0] + words[1][0]).toUpperCase();
}

</script>
