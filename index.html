<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ============================================================
    KARIS MIND — Workspace Shell
    app.karismind.com

    This file is the permanent container. It loads once on
    every visit and never changes. All page content loads
    dynamically into #content via the router.

    Load order:
    1. tokens.css   — design tokens (colours, type, spacing)
    2. shell.css    — layout, sidebar, topbar
    3. components.css — reusable UI elements
    4. utilities.css  — helper classes
    ============================================================
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tab title shown in the browser -->
  <title>Karis Mind — Workspace</title>

  <!-- Prevent search engines indexing the authenticated app -->
  <meta name="robots" content="noindex, nofollow">

  <!--
    Google Fonts
    DM Sans  → display headings, logo, titles
    Inter    → body text, labels, inputs
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Stylesheets — order is important -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>

<body>

<!--
  ================================================================
  APP WRAPPER
  The outermost container. Fills the full viewport height.
  display: flex — sidebar sits left, main area fills the right.
  ================================================================
-->
<div class="app">


  <!-- ============================================================
       SIDEBAR
       Permanent left panel. Never changes between pages.
       Contains: logo, navigation groups, user info, collapse btn.
       Width: 220px expanded / 60px collapsed (icon-only mode).
  ============================================================ -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">

    <!-- ── Logo ─────────────────────────────────────────────── -->
    <!--
      Clicking the logo always returns to Dashboard.
      Logo mark: gold square with "KM" initials.
      Logo text: "Karis Mind" — hidden when sidebar is collapsed.
    -->
    <div class="sidebar-logo" onclick="KarisRouter.go('dashboard')" role="link" tabindex="0" aria-label="Karis Mind — Go to dashboard">
      <div class="logo-mark" aria-hidden="true">KM</div>
      <span class="logo-text">Karis Mind</span>
    </div>

    <!-- ── Navigation ────────────────────────────────────────── -->
    <nav class="sidebar-nav">

      <!-- Group: Workspace -->
      <div class="nav-group-label">Workspace</div>

      <!--
        Each nav-item:
        - data-page attribute matches the route key in router.js
        - onclick calls KarisRouter.go() with the page id
        - .active class is set by setActiveNav() in shell.js
        - Icon + label. Label hidden when sidebar is collapsed.
      -->

      <button class="nav-item" data-page="dashboard"
              onclick="KarisRouter.go('dashboard')"
              aria-label="Dashboard">
        <!-- Dashboard icon: 4-square grid -->
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-label">Dashboard</span>
      </button>

      <button class="nav-item" data-page="clients"
              onclick="KarisRouter.go('clients')"
              aria-label="Clients">
        <!-- Clients icon: group of people -->
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-label">Clients</span>
      </button>

      <!-- Group: Tools -->
      <div class="nav-group-label">Tools</div>

      <button class="nav-item" data-page="meetings"
              onclick="KarisRouter.go('meetings')"
              aria-label="Meeting Toolkit">
        <!-- Meeting icon: calendar -->
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span class="nav-label">Meeting Toolkit</span>
      </button>

      <button class="nav-item" data-page="cascade"
              onclick="KarisRouter.go('cascade')"
              aria-label="Cascade">
        <!-- Cascade icon: layered rows suggesting a workplan -->
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span class="nav-label">Cascade</span>
      </button>

      <button class="nav-item" data-page="reports"
              onclick="KarisRouter.go('reports')"
              aria-label="Reports">
        <!-- Reports icon: document with lines -->
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        <span class="nav-label">Reports</span>
      </button>

      <!-- Group: Admin -->
      <div class="nav-group-label">Admin</div>

      <button class="nav-item" data-page="team"
              onclick="KarisRouter.go('team')"
              aria-label="Team">
        <!-- Team icon: person with plus -->
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
        </svg>
        <span class="nav-label">Team</span>
      </button>

      <button class="nav-item" data-page="settings"
              onclick="KarisRouter.go('settings')"
              aria-label="Settings">
        <!-- Settings icon: gear -->
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83
                   2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1
                   1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65
                   1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65
                   1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1
                   0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82
                   l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9
                   4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65
                   1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2
                   0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65
                   0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span class="nav-label">Settings</span>
      </button>

    </nav>

    <!-- ── Sidebar footer: user info + collapse button ───────── -->
    <div class="sidebar-footer">

      <!--
        User identity strip.
        Initials, name, and role pulled from KarisState.user
        by initShell() in shell.js on page load.
      -->
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebar-avatar">EN</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">Elijah Nkonde</div>
          <div class="user-role" id="sidebar-role">Org Admin</div>
        </div>
      </div>

      <!--
        Collapse button.
        Toggles sidebar between 220px (expanded) and 60px (icon-only).
        State is saved in localStorage so it persists across sessions.
        Icon flips direction on collapse.
      -->
      <button class="collapse-btn" onclick="toggleSidebar()"
              aria-label="Collapse sidebar">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" id="collapse-icon"
             aria-hidden="true">
          <path d="M11 19l-7-7 7-7"/>
          <path d="M19 19l-7-7 7-7"/>
        </svg>
        <span class="nav-label">Collapse</span>
      </button>

    </div>

  </aside>
  <!-- /sidebar -->


  <!-- ============================================================
       MAIN AREA
       Takes up all remaining width to the right of the sidebar.
       Contains: topbar (fixed) + content area (scrollable).
  ============================================================ -->
  <div class="main">

    <!-- ── Topbar ─────────────────────────────────────────────── -->
    <!--
      Permanent header strip across the top of the content area.
      Left: breadcrumb navigation (updated by router on each page change).
      Right: notification bell + user avatar.
    -->
    <header class="topbar" role="banner">

      <div class="topbar-left">
        <!--
          Breadcrumb.
          Updated dynamically by setBreadcrumb() in shell.js
          whenever the router navigates to a new page.
          Example states:
            Dashboard
            Clients
            Clients / LpWSC
        -->
        <nav class="breadcrumb" id="breadcrumb" aria-label="Page location">
          <span class="breadcrumb-item current">Dashboard</span>
        </nav>
      </div>

      <div class="topbar-right">

        <!-- Notification bell — behaviour wired in Phase 2 -->
        <button class="topbar-icon-btn" aria-label="Notifications"
                title="Notifications">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>

        <!--
          Topbar avatar.
          Initials set by initShell() from KarisState.user.
          Clicking will open a profile/sign-out menu in Phase 2.
        -->
        <div class="topbar-avatar" id="topbar-avatar"
             role="button" tabindex="0"
             aria-label="User menu"
             title="Elijah Nkonde">EN</div>

      </div>
    </header>
    <!-- /topbar -->


    <!-- ── Content area ──────────────────────────────────────── -->
    <!--
      This div is the ONLY thing that changes between pages.
      KarisRouter.go() fetches a page HTML file and injects
      it here. The sidebar and topbar always stay in place.

      The loading message is replaced immediately on first load.
    -->
    <main class="content" id="content" role="main">
      <div class="shell-loading" aria-live="polite">Loading…</div>
    </main>
    <!-- /content -->

  </div>
  <!-- /main -->

</div>
<!-- /app -->


<!--
  ================================================================
  TOAST NOTIFICATION
  Global feedback element. Shown by showToast() in shell.js.
  Sits outside the app wrapper so it floats above everything.
  ================================================================
-->
<div class="toast" id="km-toast" role="status" aria-live="polite"></div>


<!--
  ================================================================
  SCRIPTS
  Load order is critical:
  1. state.js   — KarisState must exist before anything else
  2. api.js     — KarisAPI references KarisState
  3. shell.js   — shell functions reference both
  4. router.js  — KarisRouter references all three
  ================================================================
-->
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/router.js"></script>

<!--
  Boot sequence.
  Runs after all scripts are loaded and the DOM is ready.
  initShell() sets up the sidebar user info and collapse state.
  KarisRouter.init() loads the first page into #content.
-->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    initShell();
    KarisRouter.init();
  });
</script>

</body>
</html>
